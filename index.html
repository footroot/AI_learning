<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>mytaller.info AI assistant</title>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">mytaller.info Local AI</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">Hello! Ask me anything about our neighborhood watch or room rentals.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type your question here..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script src="js.js"></script>
</body>
</html>
